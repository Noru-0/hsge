# Run configuration for run_webarena.py (real exploration on WebArena).
#
# Secrets — API keys, account passwords, WA_* site URLs — live in .env, NOT here.
# This file is safe to commit. Precedence: CLI flags > this file > built-in defaults.

run:
  site: shopping             # explore WA_<SITE> from .env (shopping -> $WA_SHOPPING)
  root_url: null             # explicit URL; overrides `site` when set
  out_dir: outputs/wa_run_demo
  allow: null                # null -> derived from the root URL's host
  denylist: "logout|\\?p=|product_list_|[?&]sort="   # blocked child URLs (deny wins)
  max_nodes: 500
  max_depth: 300
  max_steps: 15
  max_tasks: 9               # tasks PageExplorer proposes per node (more -> less chance
                             # of missing a task, but +1 Solver episode per extra task)
  maturity: 2                # times a skill must recur before it becomes an operator
  task_retries: 0            # retry a failed task up to N more times (0 = off;
                             # tasks the model reports infeasible are never retried).
                             # NOTE: multiplies worst-case LLM cost per task by 1+N
  goal_max_steps: 25         # step budget for GOAL/composite tasks (null -> max_steps);
                             # multi-step GOALs need more room than LOCAL lookups
  verify_goals: true         # re-check every self-graded GOAL success with the
                             # episode_judge model; a FAIL demotes it to fail (stops
                             # the solver grading its own homework). false = old behavior
  plan_subgoals: true        # decompose each GOAL into ordered subgoals (goal_planner)
                             # the solver pursues one at a time -- for multi-step,
                             # state-changing goals the plain loop churns on. false = off
  goal_chains_per_node: 3    # max GOAL tasks attempted per node = depth-based operator
                             # chains PLUS seed capabilities (when use_site_seed is on);
                             # each distinct chain/capability is attempted once per run
  use_site_seed: true        # derive a site {description, capabilities[]} seed on the
                             # first node, emit each capability as a top-down GOAL task
                             # (independent of the operator graph), and condition
                             # PageExplorer proposals on it. false = current behavior.
                             # Total seed GOALs over a run = number of seed capabilities
                             # (SEEDER_SYS asks for 4-8), bounded per node by the line above
  predicate_sim: 0.6         # cosine threshold for the predicate registry (tune per embedder)
  headed: false              # true -> visible browser window (debugging)
  success_url_re: null       # null -> default /checkout/onepage/success
  full_reset_url: null       # null -> $WA_FULL_RESET
  terminal_goal: null        # planning goal predicate; null -> auto (order_confirmed on
                             # shopping, disabled/exploration-only elsewhere)
  mine_hrefs: true           # mine <a href> links into the frontier (not just URLs the
                             # agent navigates to) -- prevents early frontier starvation
                             # on link-dense sites; false = old navigated-only behavior
  per_template_cap: 3        # max mined nodes admitted per URL "template" (e.g. one
                             # /f/*/comments/* shape) so near-identical pages don't flood
  max_hrefs_per_page: 100    # cap on <a href> links mined per page

llm:
  # Shared defaults. Each helper below inherits any field it does not override.
  provider: deepseek         # openai | deepseek ; null -> $LLM_PROVIDER, else openai
  model: null                # fallback model; null -> ${PROVIDER}_MODEL from .env
  base_url: null             # null -> ${PROVIDER}_BASE_URL from .env
  temperature: 0.2

  agents:
    site_seeder:             # once per run: summarizes the landing page into a
      provider: openai       # {description, capabilities[]} seed that drives GOAL tasks
      model: gpt-4o          # -- one call, and seed quality decides GOAL quality
    page_explorer:           # proposes concrete INFO/NAV/MOD tasks for each page
      provider: openai
      model: gpt-4o          # called once per node -- worth the stronger model
      vision: true           # attach a screenshot alongside the axtree
      som: true              # bid-tagged bounding boxes overlaid on the screenshot
      image_detail: low      # low | high | auto (OpenAI vision cost/quality knob)
      temperature: 0.7         # override the shared default for this agent
    solver:                  # chooses the next BrowserGym action toward a LOCAL task
      provider: openai
      model: gpt-4o-mini     # called up to max_steps times per episode -- keep cheap
      vision: true
      som: true
      image_detail: low
      temperature: 0.0         # override the shared default for this agent
    solver_goal:             # C5: stronger model for GOAL/composite tasks (optional).
      provider: openai       # GOAL solving is multi-step + reasoning-bound, so it gets
      model: gpt-5.6-terra   # a stronger model than the LOCAL solver (gpt-4o-mini).
      temperature: 1         # GPT-5.x/o-series ONLY accept the default temperature (1);
                             # any other value 400s. (OpenAILLM also drops temperature
                             # automatically if a model rejects it -- this just avoids
                             # the first wasted 400.) GPT-5.6 Terra: vision, ~5.5 at half
                             # cost. Inherits the solver's vision settings. Remove
                             # this block to reuse the LOCAL solver for GOAL too.
                             # NOTE: verify this exact model id + your account access
                             # + current price in the OpenAI dashboard before a real run.
    trajectory_segmenter:    # splits a successful trajectory into subgoals
      model: deepseek-v4-pro
    skill_abstractor:        # turns a mature trajectory cluster into a SkillCard
      model: deepseek-v4-pro
    skill_verifier:          # grounds/verifies SkillCards (inactive when verify_k=0)
      model: deepseek-v4-pro
    operator_inducer:        # induces planning preconditions/effects from a skill
      model: deepseek-v4-pro
    episode_judge:            # judge_episodes.py: re-checks declared-success
      model: deepseek-v4-pro  # episodes against their final state
    thought_reannotator:      # reannotate_thoughts.py: rewrites step thoughts
      model: deepseek-v4-pro

embedder:
  model: all-MiniLM-L6-v2
