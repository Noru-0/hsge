# Run configuration for run_webarena.py (real exploration on WebArena).
#
# Secrets — API keys, account passwords, WA_* site URLs — live in .env, NOT here.
# This file is safe to commit. Precedence: CLI flags > this file > built-in defaults.

run:
  site: reddit             # explore WA_<SITE> from .env (shopping -> $WA_SHOPPING)
  root_url: null             # explicit URL; overrides `site` when set
  out_dir: outputs/wa_run_01
  allow: null                # null -> derived from the root URL's host
  denylist: "logout|\\?p=|product_list_|[?&]sort="   # blocked child URLs (deny wins)
  max_nodes: 15
  max_depth: 6
  max_steps: 15
  max_tasks: 9               # tasks PageExplorer proposes per node (more -> less chance
                             # of missing a task, but +1 Solver episode per extra task)
  maturity: 2                # times a skill must recur before it becomes an operator
  predicate_sim: 0.6         # cosine threshold for the predicate registry (tune per embedder)
  headed: false              # true -> visible browser window (debugging)
  success_url_re: null       # null -> default /checkout/onepage/success
  full_reset_url: null       # null -> $WA_FULL_RESET
  terminal_goal: null        # planning goal predicate; null -> auto (order_confirmed on
                             # shopping, disabled/exploration-only elsewhere)

llm:
  # Shared defaults. Each helper below inherits any field it does not override.
  provider: deepseek         # openai | deepseek ; null -> $LLM_PROVIDER, else openai
  model: null                # fallback model; null -> ${PROVIDER}_MODEL from .env
  base_url: null             # null -> ${PROVIDER}_BASE_URL from .env
  temperature: 0.2

  agents:
    page_explorer:           # proposes concrete INFO/NAV/MOD tasks for each page
      provider: openai
      model: gpt-4o          # called once per node -- worth the stronger model
      vision: true           # attach a screenshot alongside the axtree
      som: true              # bid-tagged bounding boxes overlaid on the screenshot
      image_detail: low      # low | high | auto (OpenAI vision cost/quality knob)
    solver:                  # chooses the next BrowserGym action toward a task
      provider: openai
      model: gpt-4o-mini     # called up to max_steps times per episode -- keep cheap
      vision: true
      som: true
      image_detail: low
    trajectory_segmenter:    # splits a successful trajectory into subgoals
      model: deepseek-v4-flash
    skill_abstractor:        # turns a mature trajectory cluster into a SkillCard
      model: deepseek-v4-flash
    skill_verifier:          # grounds/verifies SkillCards (inactive when verify_k=0)
      model: deepseek-v4-flash
    operator_inducer:        # induces planning preconditions/effects from a skill
      model: deepseek-v4-flash

embedder:
  model: all-MiniLM-L6-v2
