# LLaMA-Factory LoRA SFT config for Qwen3.5-9B on the HSGE **cross-domain**
# dataset (reddit + shopping + shopping_admin + gitlab combined into one model,
# evaluated per-site afterward -- as opposed to the per-site qwen35_9b_lora_
# {reddit,shopping}.yaml configs, which train one adapter per domain).
# Run from the repo root on the vast.ai box:
#   /workspace/venvs/train/bin/llamafactory-cli train training/qwen35_9b_lora_all.yaml
#
# Dataset: train_all.jsonl (3751 examples / 1183 trajectories), built by
# training/merge_datasets.py from the four train_<domain>.jsonl files (each
# built with `--require-judge`, so every declared success was re-checked by an
# LLM judge). Domain mix: reddit 44.6%, shopping 20.6%, shopping_admin 6.4%,
# gitlab 28.4% -- shopping_admin is under-represented (fewer collected
# episodes); if that matters, resample/upweight before training rather than
# changing this config.
# The assistant turns are bare {"thought","action"} JSON (no <think>), so we
# train with the nothink template and serve with thinking disabled.

### model
model_name_or_path: /workspace/models/Qwen3.5-9B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset: hsge_all_train
eval_dataset: hsge_all_val
dataset_dir: training/data/all
# verified against the installed LLaMA-Factory (data/template.py): qwen3_5_nothink
# Measured with the real Qwen3.5-9B tokenizer on training/data/all/{train,val}
# (2026-08-10 dataset, post gate+task-split fix): max 4040 tokens, p99 3672, 0
# examples over 4096. 6144 was carried over from the earlier (train_all.jsonl)
# dataset's rough chars/3 estimate; on THIS dataset it OOM'd at step 9/804 with
# per_device_train_batch_size 4 (66.6/79.2 GiB used, allocator fragmentation
# from varying padded lengths across micro-batches, per the OOM message's own
# "reserved but unallocated" note) -- keeping ~2100 tokens of unneeded padding
# headroom was buying nothing but a bigger worst-case activation footprint.
# 4096 has zero truncation risk against the measured max and removes that
# headroom; if a future dataset's real max exceeds this, re-measure and raise
# it rather than restoring 6144 blind.
template: qwen3_5_nothink
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: /workspace/saves/qwen35-9b-lora-all
logging_steps: 10
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
report_to: none

### train  (effective batch = 4 * 4 = 16 -> ~223 steps/epoch on ~3561 examples)
# The 4/4 split is measured, not arbitrary: on an H100-80GB, 2/8 runs at 26-29
# s/step with the GPU at 0-46% util and ~150 W -- starved. 4/4 runs the same
# effective batch at 11-13 s/step, 100% util, 380 W (~2.4x faster, ~2.2 h
# instead of ~5 h). 8/2 OOMs, and where it OOMs says why: cross_entropy asks for
# 22 GiB in one allocation, because Qwen3.5's ~151k vocab makes the logits
# tensor (batch x seq x vocab x 4 B) the largest single thing in the step. Raise
# the batch past 4 only together with `enable_liger_kernel: true`, whose fused
# linear cross-entropy avoids materializing those logits at all (liger does
# support qwen3_5 -- untested here).
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true

### eval
per_device_eval_batch_size: 2
eval_strategy: epoch
