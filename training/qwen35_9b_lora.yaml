# LLaMA-Factory LoRA SFT config for Qwen3.5-9B on the HSGE solver dataset.
# Run from the repo root on the vast.ai box:
#   /workspace/venvs/train/bin/llamafactory-cli train training/qwen35_9b_lora.yaml
#
# The dataset's assistant turns are bare {"thought","action"} JSON (no <think>),
# so we train with the nothink template and serve with thinking disabled.

### model
model_name_or_path: /workspace/models/Qwen3.5-9B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset: hsge_gitlab_train
eval_dataset: hsge_gitlab_val
dataset_dir: training/data
# verified against the installed LLaMA-Factory (data/template.py): qwen3_5_nothink
template: qwen3_5_nothink
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: /workspace/saves/qwen35-9b-lora-hsge
logging_steps: 5
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
report_to: none

### train  (effective batch = 2 * 8 = 16 -> ~22 steps/epoch on 350 examples)
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true

### eval
per_device_eval_batch_size: 2
eval_strategy: epoch
